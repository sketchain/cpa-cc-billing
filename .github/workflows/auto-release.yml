name: Auto release

# Tags each new version on main and starts its release, once the Check
# workflow has passed for that push, so a failing commit is never tagged. The
# version is the first "## vX.Y.Z" heading of Changelog.md, which must match
# the plugin Version in internal/plugin/types.go. A tag pushed with
# GITHUB_TOKEN does not trigger release.yml's tag event, so this workflow
# dispatches it explicitly.

on:
  workflow_run:
    workflows:
      - Check
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and dispatch release
    # Only a successful Check of a push to main; pull requests from main also
    # run Check on the main branch name.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # The commit Check passed, not whatever main points to now.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Read release version
        id: version
        run: |
          heading="$(grep -m1 '^## ' Changelog.md || true)"
          if ! printf '%s\n' "$heading" | grep -Eq '^## v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=Changelog.md::The first release heading must be '## vX.Y.Z', found '$heading'"
            exit 1
          fi
          tag="${heading#'## '}"
          plugin_version="$(awk -F'"' '/^[[:space:]]*Version[[:space:]]*=/ {print $2; exit}' internal/plugin/types.go)"
          if [ "$tag" != "v$plugin_version" ]; then
            echo "::error file=internal/plugin/types.go::Changelog.md is at $tag but the plugin Version is $plugin_version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create tag
        id: tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$HEAD_SHA"
          git push origin "refs/tags/$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch release workflow
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" -f release_tag="$TAG"
